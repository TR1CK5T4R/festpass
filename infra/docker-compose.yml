name: festpass

# Host ports default to non-standard values (5433, 27018, 6380) so they don't clash
# with databases already installed on the machine. Override them in .env.
# Every port binds to 127.0.0.1 so these dev services aren't reachable from the network.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: festpass
      POSTGRES_PASSWORD: festpass
      POSTGRES_DB: festpass
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U festpass -d festpass']
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - '127.0.0.1:${MONGO_PORT:-27018}:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # appendonly: BullMQ jobs survive a container restart.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    # S3-compatible storage, standing in for Cloudflare R2 locally. MinIO's free images can no longer
    # be pulled, so this is SeaweedFS; the API only speaks the S3 protocol, so the code doesn't care.
    image: chrislusf/seaweedfs:4.50
    command: ['server', '-s3', '-dir=/data']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-festpass}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-festpass-dev-secret}
    ports:
      - '127.0.0.1:${S3_PORT:-9000}:8333'
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  seaweedfs_data:
