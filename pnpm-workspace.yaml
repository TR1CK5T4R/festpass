packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  unrs-resolver: false
  # Prisma downloads its schema engine (used by migrate) in a postinstall script.
  '@prisma/engines': true
  prisma: true
  # bcrypt is a native module; its install script loads a prebuilt binary (or compiles one).
  bcrypt: true
  # Optional native speed-up for BullMQ's serializer; the pure-JS fallback is fine.
  msgpackr-extract: false
